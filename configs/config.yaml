# 服务 bootstrap 配置。
# 生产约束：
# 1. server/mysql/redis/internal_grpc/config_center/id 属于启动配置；
# 2. scheduler/worker/callback/storage/public_grpc/mq 等业务运行参数统一通过后台 runtime config 维护；
# 3. 程序内置一组稳定的首启默认值，仅在数据库还没有已发布 runtime config 时写入；
# 4. 首次落库后，运行期业务配置统一通过后台动态接口维护并热更新，
#    修改本文件不会直接变成运行期热更新。

server:
  # HTTP 服务监听地址。
  listen_address: ":8888"
  # 对外广播 IP；为空或 auto 时自动探测。
  advertise_ip: ""
  # 服务名，用于日志和集群内标识。
  service_name: "hili-video-cloud"
  # 当前节点 ID。
  node_id: 1
  # 当前 Worker 实例标识。
  worker_id: "worker-local-1"

mysql:
  # MySQL 连接串。
  dsn: "root:123456@tcp(127.0.0.1:3306)/hvc?parseTime=true&charset=utf8mb4"
  # 是否启用分库分表。
  sharding_enabled: false
  # 分片数量。
  shard_count: 1
  # 查询超时。
  query_timeout: "3s"
  # 写入超时。
  exec_timeout: "5s"

redis:
  # Redis 地址列表。
  addrs:
    - "127.0.0.1:6379"
  password: "123456"
  db: 0
  cluster_enabled: false
  dial_timeout: "2s"
  read_timeout: "2s"
  write_timeout: "2s"

internal_grpc:
  # 集群内部 gRPC 通信入口，节点启动即初始化，不参与运行期热启停。
  enabled: true
  listen_address: ":19090"
  # 集群内部控制面共享令牌；生产环境请替换为高强度随机值。
  shared_token: "hvc-internal-local-token"
  max_recv_msg_size: 64
  max_send_msg_size: 64
  graceful_stop_timeout: "5s"

config_center:
  # 外部配置中心只承载 bootstrap / 集群基础配置，不直接承载 runtime 业务动态配置。
  enabled: false
  endpoint: ""
  namespace: ""
  auth_mode: "none"
  token: ""

id:
  start_time: "2025-01-01T00:00:00Z"
  node_bits: 10
  sequence_bits: 12

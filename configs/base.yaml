server:
  listen_address: ":8080"
  service_name: "hvc"
  node_id: 1
  worker_id: "worker-local-1"
mode:
  enable_http_server: true
  enable_grpc_server: true
  enable_mq_consumer: true
  enable_scheduler: true
  enable_worker: true
  enable_callback: true
mysql:
  dsn: "root:root@tcp(127.0.0.1:3306)/hvc?parseTime=true&charset=utf8mb4"
  sharding_enabled: false
  shard_count: 1
  query_timeout: "3s"
  exec_timeout: "5s"
redis:
  addrs:
    - "127.0.0.1:6379"
  password: ""
  db: 0
  cluster_enabled: false
  dial_timeout: "2s"
  read_timeout: "2s"
  write_timeout: "2s"
scheduler:
  loop_interval: "5s"
  job_lease_ttl: "60s"
  worker_heartbeat_timeout: "20s"
  require_hardware_encode: true
  allow_software_decode_fallback: true
  require_hardware_watermark: true
  soft_decode_cpu_limit_percent: 50
  node_cpu_safety_limit_percent: 85
  node_memory_safety_limit_percent: 85
  node_gpu_safety_limit_percent: 90
  max_global_transcode_sessions: 32
  max_node_transcode_sessions: 8
  max_node_upload_concurrency: 16
  dynamic_concurrency_control: true
worker:
  loop_interval: "5s"
  single_job_upload_concurrency: 4
  source_read_timeout: "30s"
  upload_retry_base_delay: "500ms"
  upload_retry_max_delay: "30s"
  upload_max_retry_count: 5
callback:
  http_timeout: "3s"
  grpc_timeout: "3s"
  mq_timeout: "3s"
  retry_backoff: "2s"
config_center:
  enabled: false
  endpoint: ""
  namespace: ""
  auth_mode: "none"
  token: ""
id:
  start_time: "2025-01-01T00:00:00Z"
  node_bits: 10
  sequence_bits: 12
  max_js_integer_safe: 9007199254740991
storage:
  endpoint: "127.0.0.1:9000"
  bucket: "hvc"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
  use_ssl: false
  base_prefix: "transcode"

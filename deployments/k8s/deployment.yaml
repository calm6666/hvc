# ============================================================
# HVC 视频转码服务 - Kubernetes 示例部署
# ============================================================
#
# 说明：
# 1. 当前程序的 bootstrap 配置来源是 config.yaml 文件；
# 2. scheduler/worker/callback/storage/public grpc/mq 等业务动态配置
#    不应写在这里，而是通过后台 runtime config 维护；
# 3. 本清单演示如何把 bootstrap 配置以 ConfigMap 文件方式挂载进容器。
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: hvc
  labels:
    app: hvc

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hvc-bootstrap-config
  namespace: hvc
data:
  config.yaml: |
    server:
      listen_address: ":8080"
      advertise_ip: ""
      service_name: "hili-video-cloud"
      node_id: 1
      worker_id: "hvc-k8s-node-1"

    mysql:
      dsn: "hvc:hvc_pwd@tcp(hvc-mysql.hvc.svc.cluster.local:3306)/hvc?parseTime=true&charset=utf8mb4"
      sharding_enabled: false
      shard_count: 1
      query_timeout: "3s"
      exec_timeout: "5s"

    redis:
      addrs:
        - "hvc-redis.hvc.svc.cluster.local:6379"
      password: ""
      db: 0
      cluster_enabled: false
      dial_timeout: "2s"
      read_timeout: "2s"
      write_timeout: "2s"

    internal_grpc:
      enabled: true
      listen_address: ":19090"
      shared_token: "replace-me-in-production"
      max_recv_msg_size: 64
      max_send_msg_size: 64
      graceful_stop_timeout: "5s"

    config_center:
      enabled: false
      endpoint: ""
      namespace: ""
      auth_mode: "none"
      token: ""

    id:
      start_time: "2025-01-01T00:00:00Z"
      node_bits: 10
      sequence_bits: 12

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hvc-server
  namespace: hvc
  labels:
    app: hvc-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hvc-server
  template:
    metadata:
      labels:
        app: hvc-server
    spec:
      containers:
        - name: hvc-server
          image: hvc-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/hvc/config.yaml"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9090
              name: grpc-public
              protocol: TCP
            - containerPort: 19090
              name: grpc-internal
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: config-volume
              mountPath: /etc/hvc/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp/hvc
      volumes:
        - name: config-volume
          configMap:
            name: hvc-bootstrap-config
        - name: tmp-volume
          emptyDir:
            medium: ""
      terminationGracePeriodSeconds: 60

---
apiVersion: v1
kind: Service
metadata:
  name: hvc-server
  namespace: hvc
  labels:
    app: hvc-server
spec:
  type: ClusterIP
  selector:
    app: hvc-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc-public
      port: 9090
      targetPort: grpc-public
      protocol: TCP
    - name: grpc-internal
      port: 19090
      targetPort: grpc-internal
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hvc-server-hpa
  namespace: hvc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hvc-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

# ============================================================
# HVC 视频转码服务 - Nginx 反向代理配置
# ============================================================
#
# 功能：
#   - HTTP API 反向代理
#   - WebSocket 实时监控代理
#   - gRPC 代理（集群内部通信）
#   - 静态资源缓存
#   - SSL/TLS 终结
#   - 请求限流
#
# 使用方法：
#   将此文件复制到 /etc/nginx/conf.d/hvc.conf
#   nginx -t && nginx -s reload
# ============================================================

# ---- 上游服务定义 ----
upstream hvc_http_backend {
    # HVC HTTP 服务地址（支持多节点负载均衡）
    # 权重分配：按节点 GPU 能力分配
    server 127.0.0.1:8080 weight=1 max_fails=3 fail_timeout=30s;
    # 集群模式添加更多节点：
    # server 10.0.1.2:8080 weight=2 max_fails=3 fail_timeout=30s;
    # server 10.0.1.3:8080 weight=1 max_fails=3 fail_timeout=30s;

    # 保持长连接，减少 TCP 握手开销
    keepalive 32;
}

# public gRPC 上游服务
upstream hvc_grpc_backend {
    server 127.0.0.1:9090;
    # 集群模式下如需对外发布多节点 public gRPC，可继续追加：
    # server 10.0.1.2:9090;
}

# ---- HTTP 服务器（重定向到 HTTPS） ----
server {
    listen 80;
    server_name hvc.example.com;

    # 健康检查端点不重定向（用于负载均衡器探测）
    location = /healthz {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 服务器 ----
server {
    listen 443 ssl http2;
    server_name hvc.example.com;

    # ---- SSL/TLS 配置 ----
    # 证书路径（替换为实际证书路径）
    ssl_certificate     /etc/nginx/ssl/hvc.crt;
    ssl_certificate_key /etc/nginx/ssl/hvc.key;
    # SSL 协议版本
    ssl_protocols TLSv1.2 TLSv1.3;
    # 加密套件
    ssl_ciphers HIGH:!aNULL:!MD5;
    # 优先使用服务端加密套件
    ssl_prefer_server_ciphers on;
    # SSL 会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 安全头 ----
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options nosniff;
    # 防止点击劫持
    add_header X-Frame-Options DENY;
    # XSS 防护
    add_header X-XSS-Protection "1; mode=block";
    # HSTS（强制 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 请求限流 ----
    # 通用 API 限流：每秒 100 请求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    # 转码创建限流：每秒 10 请求（防止突发大量任务）
    limit_req_zone $binary_remote_addr zone=create_limit:10m rate=10r/s;

    # ---- 公共 API ----
    # 创建转码任务（限流保护）
    location /v1/transcode/job/create {
        limit_req zone=create_limit burst=20 nodelay;
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 创建任务可能需要等待调度，设置较长超时
        proxy_read_timeout 60s;
    }

    # 进度查询
    location /v1/transcode/job/progress {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 清单服务 ----
    # DASH MPD 动态生成
    location /v1/manifest/dash/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # MPD 响应缓存 5 秒（减少数据库查询压力）
        proxy_cache_valid 200 5s;
        add_header Cache-Control "public, max-age=5";
    }

    # HLS m3u8 动态生成
    location /v1/manifest/hls/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # m3u8 响应缓存 5 秒
        proxy_cache_valid 200 5s;
        add_header Cache-Control "public, max-age=5";
    }

    # ---- WebSocket 实时监控 ----
    location /v1/admin/transcode/monitor/ws {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket 升级头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # WebSocket 长连接超时（1 小时）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 管理后台 API ----
    location /v1/admin/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 集群内部 API（限制来源 IP） ----
    location /v1/internal/ {
        # 仅允许集群内部网段访问
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 直播 API ----
    location /v1/live/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 系统健康检查 ----
    location = /healthz {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 健康检查不缓存
        add_header Cache-Control "no-cache, no-store";
    }
}

# ---- public gRPC 服务器 ----
server {
    listen 9090 http2;
    server_name _;

    # gRPC 代理配置
    location / {
        grpc_pass grpc://hvc_grpc_backend;
        # gRPC 超时设置
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
        # 连接超时
        grpc_connect_timeout 10s;
    }
}

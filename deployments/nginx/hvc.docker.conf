upstream hvc_http_backend {
    server hvc-server:8080;
    keepalive 32;
}

upstream hvc_grpc_backend {
    server hvc-server:9090;
}

server {
    listen 80;
    server_name _;

    location = /healthz {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/transcode/job/create {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /v1/transcode/job/progress {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/manifest/dash/ {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=5";
    }

    location /v1/manifest/hls/ {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=5";
    }

    location /v1/admin/transcode/monitor/ws {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/admin/ {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/live/ {
        proxy_pass http://hvc_http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 9090 http2;
    server_name _;

    location / {
        grpc_pass grpc://hvc_grpc_backend;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
        grpc_connect_timeout 10s;
    }
}

openapi: 3.0.3
info:
  title: HVC 后台管理 API
  description: |
    视频转码服务后台管理接口。
    
    包含认证、配置管理、回调管理、RBAC 权限、集群管理、
    转码任务管理、直播频道管理、审计日志等模块。
    所有管理接口需要后台会话认证（Authorization Bearer 或 HttpOnly Cookie）和 RBAC 权限校验。
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: 本地开发环境

paths:
  /v1/admin/auth/login:
    post:
      summary: 管理员登录
      description: 使用用户名密码登录；服务端通过 HttpOnly Cookie 写入后台会话，不在响应体回传明文 session token。
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                otp_code:
                  type: string
                  description: OTP 验证码（启用二步验证时必填）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      authenticated:
                        type: boolean
                      token_transport:
                        type: object
                        properties:
                          type:
                            type: string
                          cookie_name:
                            type: string
                          http_only:
                            type: boolean

  /v1/admin/auth/logout:
    post:
      summary: 管理员登出
      tags: [Auth]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string

  /v1/admin/auth/me:
    get:
      summary: 获取当前用户信息
      description: 返回当前登录管理员的会话状态、脱敏后的用户信息、权限键列表以及可见菜单树。
      tags: [Auth]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      authenticated:
                        type: boolean
                      admin_user_id:
                        type: integer
                        format: uint64
                      user:
                        type: object
                        properties:
                          admin_user_id:
                            type: integer
                            format: uint64
                          username:
                            type: string
                          display_name:
                            type: string
                          status:
                            type: integer
                          last_login_at:
                            type: string
                            format: date-time
                          last_login_ip:
                            type: string
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                      permission_keys:
                        type: array
                        items:
                          type: string
                      menu_tree:
                        type: array
                        items:
                          type: object

  /v1/admin/ping:
    get:
      summary: 后台接口存活检查
      description: 用于验证后台会话与权限链路是否可用，响应结构遵循统一 `code/message` 格式。
      tags: [Auth]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string

  /v1/admin/config/runtime/versions:
    get:
      summary: 查询运行配置版本列表
      description: 查询所有历史配置版本，支持回滚到指定版本；敏感连接字段仅返回脱敏值。
      tags: [Config]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: published
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      page:
                        type: integer
                      page_size:
                        type: integer
                      total:
                        type: integer
                        format: int64
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            config_version:
                              type: integer
                              format: uint64
                            enable_http_server:
                              type: boolean
                            enable_callback:
                              type: boolean
                            default_profile_id:
                              type: integer
                              format: uint64
                            max_global_transcode_sessions:
                              type: integer
                            job_lease_ttl_sec:
                              type: integer
                            worker_heartbeat_timeout_sec:
                              type: integer
                            allow_request_override_profile:
                              type: boolean
                            allow_request_override_segment_duration:
                              type: boolean
                            allow_request_override_hwaccel:
                              type: boolean
                            published:
                              type: boolean
                            scheduler_loop_interval_ms:
                              type: integer
                            worker_loop_interval_ms:
                              type: integer
                            require_hardware_encode:
                              type: boolean
                            allow_software_decode_fallback:
                              type: boolean
                            require_hardware_watermark:
                              type: boolean
                            node_cpu_safety_limit_percent:
                              type: integer
                            node_memory_safety_limit_percent:
                              type: integer
                            node_gpu_safety_limit_percent:
                              type: integer
                            single_job_upload_concurrency:
                              type: integer
                            callback_http_url:
                              type: string
                            callback_rpc_endpoint:
                              type: string
                              description: 已脱敏显示
                            callback_mq_topic:
                              type: string
                            enable_grpc_server:
                              type: boolean
                            grpc_listen_address:
                              type: string
                            enable_mq_consumer:
                              type: boolean
                            mq_queue_name:
                              type: string
                            mq_host:
                              type: string
                            mq_port:
                              type: integer
                            mq_username:
                              type: string
                            mq_password:
                              type: string
                              description: 已脱敏显示
                            mq_vhost:
                              type: string
                            mq_consumer_tag:
                              type: string
                            mq_prefetch_count:
                              type: integer
                            storage_type:
                              type: string
                            storage_endpoint:
                              type: string
                            storage_bucket:
                              type: string
                            storage_access_key_id:
                              type: string
                              description: 已脱敏显示
                            storage_secret_access_key:
                              type: string
                              description: 已脱敏显示
                            storage_use_ssl:
                              type: boolean
                            storage_play_domain:
                              type: string
                            storage_flv_domain:
                              type: string
                            storage_local_base_path:
                              type: string
                            default_storage_id:
                              type: integer
                              format: uint64
                            worker_object_prefix:
                              type: string
                            change_summary:
                              type: string
                            config_source:
                              type: string
                            source_revision:
                              type: string
                            published_by:
                              type: string
                            published_at:
                              type: string
                              format: date-time
                            effective_config_hash:
                              type: string
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time

  /v1/admin/config/runtime/update:
    post:
      summary: 更新运行配置
      description: |
        运行期业务配置只从数据库已发布版本生效；本地 YAML 仅在空库首启时初始化默认值。
        更新动态运行配置（调度器、Worker、gRPC、MQ、回调等）。
        更新后生成新版本，需通过 /publish 发布生效。
        发布后会热更新新任务、待调度任务以及运行中的后台模块状态。
        其中 gRPC 对外服务与 MQ 创建任务消费者支持按配置动态启停和换地址/换队列重建。
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                default_profile_id:
                  type: integer
                  format: uint64
                max_global_transcode_sessions:
                  type: integer
                job_lease_ttl_sec:
                  type: integer
                worker_heartbeat_timeout_sec:
                  type: integer
                allow_request_override_profile:
                  type: boolean
                allow_request_override_segment_duration:
                  type: boolean
                allow_request_override_hwaccel:
                  type: boolean
                scheduler_loop_interval_ms:
                  type: integer
                  description: 调度器扫描周期，单位毫秒
                worker_loop_interval_ms:
                  type: integer
                  description: Worker 主循环周期，单位毫秒
                single_job_upload_concurrency:
                  type: integer
                require_hardware_encode:
                  type: boolean
                allow_software_decode_fallback:
                  type: boolean
                require_hardware_watermark:
                  type: boolean
                node_cpu_safety_limit_percent:
                  type: integer
                node_memory_safety_limit_percent:
                  type: integer
                node_gpu_safety_limit_percent:
                  type: integer
                enable_http_server:
                  type: boolean
                  description: 发布后动态启停 HTTP 对外接口与 WebSocket 监控入口
                enable_callback:
                  type: boolean
                  description: 发布后动态启停回调投递模块
                callback_http_url:
                  type: string
                  description: 默认 HTTP 回调地址，仅在未配置 callback_config 表时作为兼容兜底使用
                callback_mq_topic:
                  type: string
                  description: 默认 MQ 回调 routing key，供系统级 MQ 回调兜底使用
                enable_grpc_server:
                  type: boolean
                  description: 发布后动态启停对外 gRPC 服务
                grpc_listen_address:
                  type: string
                  description: gRPC 监听地址，格式如 :9090 或 0.0.0.0:9090
                enable_mq_consumer:
                  type: boolean
                  description: 发布后动态启停 MQ 创建任务消费者；启用时仍需同时提供 mq_queue_name 与 mq_host
                mq_queue_name:
                  type: string
                mq_host:
                  type: string
                mq_port:
                  type: integer
                mq_username:
                  type: string
                mq_password:
                  type: string
                mq_vhost:
                  type: string
                mq_consumer_tag:
                  type: string
                mq_prefetch_count:
                  type: integer
                storage_type:
                  type: string
                storage_endpoint:
                  type: string
                storage_bucket:
                  type: string
                storage_access_key_id:
                  type: string
                storage_secret_access_key:
                  type: string
                storage_use_ssl:
                  type: boolean
                storage_play_domain:
                  type: string
                storage_flv_domain:
                  type: string
                storage_local_base_path:
                  type: string
                default_storage_id:
                  type: integer
                  format: uint64
                worker_object_prefix:
                  type: string
                change_summary:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      pending_config_version:
                        type: integer
                        format: uint64
                      published:
                        type: boolean

  /v1/admin/config/publish:
    post:
      summary: 发布配置版本
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_version]
              properties:
                config_version:
                  type: integer
                  format: uint64
                publish_reason:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      config_version:
                        type: integer
                        format: uint64
                      published:
                        type: boolean
                      effective_scope:
                        type: object
                        properties:
                          new_jobs:
                            type: boolean
                          queued_jobs:
                            type: boolean
                          running_jobs:
                            type: boolean

  /v1/admin/config/callback/list:
    get:
      summary: 查询回调配置列表
      description: 查询所有回调目标配置（HTTP/gRPC/MQ），支持动态启用/禁用。
      tags: [Callback]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: callback_name
          in: query
          schema:
            type: string
        - name: enabled
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      page:
                        type: integer
                      page_size:
                        type: integer
                      total:
                        type: integer
                        format: int64
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            callback_config_id:
                              type: integer
                              format: uint64
                            callback_name:
                              type: string
                            callback_type:
                              type: integer
                            target_url:
                              type: string
                            rpc_endpoint:
                              type: string
                            rpc_service_name:
                              type: string
                            mq_exchange:
                              type: string
                            mq_routing_key:
                              type: string
                            timeout_ms:
                              type: integer
                            retry_times:
                              type: integer
                            enabled:
                              type: boolean
                            priority:
                              type: integer
                            registry_id:
                              type: integer
                              format: uint64
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time

  /v1/admin/config/callback/upsert:
    post:
      summary: 创建或更新回调配置
      description: |
        动态配置回调目标。支持三种回调方式：
        - HTTP 回调：转码完成后向指定 URL 发送 POST 请求
        - gRPC 回调：调用指定 gRPC 服务
        - MQ 回调：发送消息到指定消息队列
      tags: [Callback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callback_config_id:
                  type: integer
                  format: uint64
                callback_name:
                  type: string
                callback_type:
                  type: integer
                target_url:
                  type: string
                rpc_endpoint:
                  type: string
                rpc_service_name:
                  type: string
                mq_exchange:
                  type: string
                mq_routing_key:
                  type: string
                timeout_ms:
                  type: integer
                retry_times:
                  type: integer
                enabled:
                  type: boolean
                priority:
                  type: integer
                registry_id:
                  type: integer
                  format: uint64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      callback_config_id:
                        type: integer
                        format: uint64

  /v1/admin/config/callback/enabled:
    post:
      summary: 启用/禁用回调配置
      tags: [Callback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [callback_config_id, enabled]
              properties:
                callback_config_id:
                  type: integer
                  format: uint64
                enabled:
                  type: boolean
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      callback_config_id:
                        type: integer
                        format: uint64
                      enabled:
                        type: boolean

  /v1/admin/config/naming-template/list:
    get:
      summary: 查询分片命名模板方案列表
      description: |
        分页返回六种预置模板方案及其示例，以及当前生效的模板。
        所有方案都包含稳定占位符 {rendition_key}，用于保证同一任务重试时分片文件名不漂移。
      tags: [NamingTemplate]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      page:
                        type: integer
                      page_size:
                        type: integer
                      total:
                        type: integer
                        format: int64
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: 方案ID（1~6）
                            name:
                              type: string
                            template:
                              type: string
                            example_init_video:
                              type: string
                            example_media_video:
                              type: string
                            example_init_audio:
                              type: string
                            example_media_audio:
                              type: string
                            description:
                              type: string
                      current_template:
                        type: string

  /v1/admin/config/naming-template/configure:
    post:
      summary: 配置命名模板
      description: |
        选择一种预置模板方案或自定义模板，写入待发布配置。
        需通过 /v1/admin/config/publish 发布后生效。
      tags: [NamingTemplate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template_id:
                  type: integer
                  description: 预置方案ID（1~6），与 custom_template 二选一
                custom_template:
                  type: string
                  description: 自定义模板字符串（必须包含 {job_id} {rendition_key} {media_type} {number}）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      template:
                        type: string
                      config_version:
                        type: integer
                        format: uint64
                      published:
                        type: boolean
                      effective_scope:
                        type: string

  /v1/admin/config/naming-template/activate:
    post:
      summary: 立即生效命名模板
      description: |
        保存命名模板记录后，立即发布新的 runtime config 版本，并通过 Redis + 版本同步让各节点自动收敛。
        已运行中的任务不受影响，继续沿用各自首次锁定的分片命名模板。
      tags: [NamingTemplate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template:
                  type: string
                  description: 命名模板字符串（必须包含 {job_id} {rendition_key} {media_type} {number}）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      template:
                        type: string
                      config_version:
                        type: integer
                        format: uint64
                      published:
                        type: boolean
                      effective_scope:
                        type: string
                      running_jobs:
                        type: string

  /v1/admin/config-center/list:
    get:
      summary: 查询 bootstrap 配置源绑定列表
      description: 查询外部 bootstrap 配置源元数据；返回会显式标明 config_scope=bootstrap、affects_runtime=false，且 access_key/secret_key/token 仅返回脱敏值。
      tags: [ConfigCenter]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: provider_type
          in: query
          schema:
            type: string
        - name: enabled
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      config_scope:
                        type: string
                      affects_runtime:
                        type: boolean
                      runtime_update_path:
                        type: string
                      runtime_publish_path:
                        type: string
                      page:
                        type: integer
                      page_size:
                        type: integer
                      total:
                        type: integer
                        format: int64
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            binding_id:
                              type: integer
                              format: uint64
                            binding_name:
                              type: string
                            provider_type:
                              type: string
                            endpoint:
                              type: string
                            namespace:
                              type: string
                            auth_mode:
                              type: string
                            access_key:
                              type: string
                              description: 已脱敏显示
                            secret_key:
                              type: string
                              description: 已脱敏显示
                            token:
                              type: string
                              description: 已脱敏显示
                            enabled:
                              type: boolean
                            priority:
                              type: integer
                            last_sync_status:
                              type: string
                            last_sync_message:
                              type: string
                            last_sync_at:
                              type: string
                              format: date-time
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                            config_scope:
                              type: string
                            affects_runtime:
                              type: boolean
                            binding_usage:
                              type: array
                              items:
                                type: string

  /v1/admin/config-center/upsert:
    post:
      summary: 创建或更新 bootstrap 配置源绑定
      description: 维护 MySQL/集群注册/节点身份等启动基础配置来源，不直接发布运行期业务配置；响应会显式标明 config_scope=bootstrap、affects_runtime=false。
      tags: [ConfigCenter]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                binding_id:
                  type: integer
                  format: uint64
                binding_name:
                  type: string
                provider_type:
                  type: string
                endpoint:
                  type: string
                namespace:
                  type: string
                auth_mode:
                  type: string
                access_key:
                  type: string

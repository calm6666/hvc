openapi: 3.0.3
info:
  title: HVC 公共转码 API
  description: |
    视频点播转码服务公共接口。
    
    提供转码任务创建、进度查询、清单获取和直播播放信息查询。
    除集群内部 gRPC 通信外，所有对外接口均通过 HTTP 暴露。
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: 本地开发环境

paths:
  /v1/transcode/job/create:
    post:
      summary: 创建转码任务
      description: |
        提交一个视频转码任务。
        系统根据配置自动选择编码阶梯、硬件加速类型和存储目标。
        通过 request_id 保证幂等，重复提交返回已有任务。
      operationId: createTranscodeJob
      tags: [Transcode]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'

  /v1/transcode/job/progress:
    get:
      summary: 查询转码进度
      description: |
        通过 request_id 查询转码任务实时进度。
        返回当前阶段、进度千分比、帧率、码率和速度等信息。
      operationId: queryTranscodeProgress
      tags: [Transcode]
      parameters:
        - name: request_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryProgressResponse'

  /v1/manifest/dash/{job_id}:
    get:
      summary: 动态构建 DASH MPD 播放清单
      description: |
        根据数据库中的分片元数据，实时生成 MPEG-DASH MPD 播放清单。
        支持通过查询参数控制可见清晰度，实现版权保护。
      operationId: serveMPD
      tags: [Manifest]
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
            format: uint64
        - name: renditions
          in: query
          description: 清晰度白名单（逗号分隔，如 720p,480p），版权保护用
          schema:
            type: string
        - name: max_height
          in: query
          description: 最大允许高度（如 720 表示只返回 720p 及以下），版权保护用
          schema:
            type: integer
      responses:
        '200':
          description: MPD XML 内容
          content:
            application/dash+xml:
              schema:
                type: string

  /v1/manifest/hls/{job_id}:
    get:
      summary: 动态构建 HLS Master 播放清单
      description: |
        根据数据库中的分片元数据，实时生成 HLS fMP4 Master m3u8。
        支持通过查询参数控制可见清晰度，实现版权保护。
      operationId: serveMasterM3U8
      tags: [Manifest]
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
            format: uint64
        - name: renditions
          in: query
          description: 清晰度白名单（逗号分隔），版权保护用
          schema:
            type: string
        - name: max_height
          in: query
          description: 最大允许高度，版权保护用
          schema:
            type: integer
      responses:
        '200':
          description: m3u8 内容
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string

  /v1/manifest/hls/{job_id}/{rendition}:
    get:
      summary: 动态构建 HLS Variant 播放清单
      description: |
        根据数据库中的分片元数据，实时生成指定清晰度的 HLS fMP4 Variant m3u8。
        包含 init segment 和所有 media segment 的 URL。
      operationId: serveVariantM3U8
      tags: [Manifest]
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
            format: uint64
        - name: rendition
          in: path
          required: true
          schema:
            type: string
            description: 清晰度名称（如 1080p、720p）
      responses:
        '200':
          description: m3u8 内容
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string

  /v1/live/channel/playback:
    get:
      summary: 查询直播播放信息
      description: |
        根据频道标识查询直播播放地址，包括 HLS Master URL 和 HTTP-FLV URL。
      operationId: getLivePlayback
      tags: [Live]
      parameters:
        - name: channel_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivePlaybackResponse'

  /v1/live/channel/push-auth:
    get:
      summary: 直播推流鉴权
      description: |
        对接推流入口鉴权回调，返回是否允许推流以及签名过期时间。
      operationId: livePushAuth
      tags: [Live]
      parameters:
        - name: channel_key
          in: query
          required: true
          schema:
            type: string
        - name: expire
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: sign
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveAuthResponse'

  /v1/live/channel/play-auth:
    get:
      summary: 直播播放鉴权
      description: |
        对接播放层鉴权回调，返回是否允许播放以及签名过期时间。
      operationId: livePlayAuth
      tags: [Live]
      parameters:
        - name: channel_key
          in: query
          required: true
          schema:
            type: string
        - name: expire
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: sign
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveAuthResponse'

components:
  schemas:
    CreateJobRequest:
      type: object
      required: [request_id, source_url]
      properties:
        request_id:
          type: string
          description: 外部请求唯一标识，用于幂等控制
        biz_key:
          type: string
          description: 业务侧资源主键
        source_url:
          type: string
          description: 源视频地址（支持 HTTP/HTTPS/S3/本地路径）
        profile_id:
          type: integer
          format: uint64
          description: 转码模板 ID
        priority:
          type: integer
          description: 优先级，数值越大越高
        enable_watermark:
          type: boolean
          description: 是否启用水印
        watermark:
          $ref: '#/components/schemas/Watermark'
        segment_options:
          $ref: '#/components/schemas/SegmentOptions'
        storage_options:
          $ref: '#/components/schemas/StorageOptions'
        schedule_options:
          $ref: '#/components/schemas/ScheduleOptions'
        renditions:
          type: array
          description: 自定义输出清晰度列表（空则使用默认编码阶梯）
          items:
            $ref: '#/components/schemas/RenditionOption'
        video_options:
          $ref: '#/components/schemas/VideoOptions'
        thumbnail_options:
          $ref: '#/components/schemas/ThumbnailOptions'
        callback_url:
          type: string
          description: 单任务回调目标，优先于系统级回调配置；支持 https://callback.example.com/path、grpc://127.0.0.1:9000/pkg.Service/Method、mq://exchange/routing.key
          example: grpc://127.0.0.1:9000/transcode.callback.Service/Notify

    Watermark:
      type: object
      properties:
        image_url:
          type: string
          description: 水印图片地址
        anchor:
          type: integer
          description: 锚点位置 1=左上 2=右上 3=左下 4=右下
        x_ratio:
          type: number
          description: X 轴偏移比例
        y_ratio:
          type: number
          description: Y 轴偏移比例
        width_ratio:
          type: number
          description: 水印宽度占视频宽度比例
        opacity:
          type: number
          description: 透明度 0.0~1.0
        safe_margin_ratio:
          type: number
          description: 安全边距比例

    SegmentOptions:
      type: object
      properties:
        segment_duration_sec:
          type: integer
          default: 6
          description: 分片时长（秒）
        support_dash:
          type: boolean
          default: true
          description: 是否支持 DASH 协议输出
        support_hls:
          type: boolean
          default: true
          description: 是否支持 HLS 协议输出
        naming_template_id:
          type: integer
          format: uint64
          description: 分片命名模板 ID；当前服务端会显式拒绝该字段，请改用后台全局命名模板配置

    StorageOptions:
      type: object
      properties:
        storage_id:
          type: integer
          format: uint64
          description: 存储配置 ID；当前服务端会显式拒绝该字段
        bucket_prefix:
          type: string
          description: 存储桶前缀；当前会真实作用于任务输出对象前缀
        segment_prefix:
          type: string
          description: 分片前缀；当前服务端会显式拒绝该字段

    ScheduleOptions:
      type: object
      properties:
        preferred_hwaccel:
          type: string
          description: 偏好硬件加速类型 (nvidia/intel_qsv/amd_amf/vaapi/videotoolbox/software)
        allow_software_decode_fallback:
          type: boolean
          default: true
          description: 硬件不支持时是否允许软解降级；当前服务端会显式拒绝该字段
        max_wait_seconds:
          type: integer
          description: 等待调度的最大秒数；当前服务端会显式拒绝该字段

    RenditionOption:
      type: object
      properties:
        name:
          type: string
          description: 清晰度名称
        width:
          type: integer
          description: 输出宽度（0 自动计算）
        height:
          type: integer
          description: 输出高度（0 自动计算）
        video_codec:
          type: string
          description: 视频编码器
        video_bitrate_kbps:
          type: integer
          description: 视频码率
        video_maxrate_kbps:
          type: integer
          description: 视频最大码率
        video_bufsize_kbps:
          type: integer
          description: 视频缓冲区大小
        preset:
          type: string
          description: 编码器预设

    VideoOptions:
      type: object
      description: 当前服务端尚未实际消费该对象；传入 aspect_fill_mode 会被显式拒绝
      properties:
        output_aspect_keep:
          type: boolean
          description: 是否保持原始宽高比
        aspect_fill_mode:
          type: string
          description: 画面填充模式，例如 fit 或 crop

    ThumbnailOptions:
      type: object
      properties:
        enable_sprite:
          type: boolean
          description: 是否生成雪碧图
        sprite_rows:
          type: integer
        sprite_cols:
          type: integer
        thumb_interval_sec:
          type: integer
        thumb_width:
          type: integer
        thumb_height:
          type: integer
        sprite_image_format:
          type: string
        sprite_storage_prefix:
          type: string
        enable_binary_index:
          type: boolean
        binary_storage_prefix:
          type: string
        binary_max_size_bytes:
          type: integer
          format: uint64

    CreateJobResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            job_id:
              type: integer
              format: uint64
              description: 任务 ID（雪花 ID）
            request_id:
              type: string
            status:
              type: integer
            status_name:
              type: string

    QueryProgressResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            job_id:
              type: integer
              format: uint64
            status:
              type: integer
            stage:
              type: string
              description: 当前阶段 queued/probing/transcoding/uploading/completed/failed
            progress_permille:
              type: integer
              description: 进度千分比 0~1000
            current_fps:
              type: number
            current_bitrate_kbps:
              type: number
            current_speed:
              type: number
            elapsed_ms:
              type: integer
              format: int64
            estimated_remaining_ms:
              type: integer
              format: int64
            updated_at:
              type: string
              format: date-time

    NodeInfo:
      type: object
      properties:
        node_id:
          type: integer
          format: uint64
        host:
          type: string
        enabled:
          type: boolean
        quarantined:
          type: boolean
        active_sessions:
          type: integer

    LivePlaybackResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            channel_key:
              type: string
            status:
              type: string
              description: 播放态状态值，当前实现返回 IDLE / RUNNING / STOPPED
            play_token:
              type: string
            expire_at:
              type: integer
              format: int64
            master_hls_url:
              type: string
            http_flv_url:
              type: string
            rendition_names:
              type: array
              items:
                type: string
            renditions:
              type: array
              items:
                type: object
                properties:
                  rendition_name:
                    type: string
                  is_source:
                    type: boolean
                  hls_url:
                    type: string
                  http_flv_url:
                    type: string

    LiveAuthResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            allowed:
              type: boolean
            reason:
              type: string
            channel_key:
              type: string
            expire_at:
              type: integer
              format: int64
